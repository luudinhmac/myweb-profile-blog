apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: portfolio-postgres
spec:
  serviceName: portfolio-postgres
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-postgres
  template:
    metadata:
      labels:
        app: portfolio-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: manual
        volumeName: postgres-pv
        resources:
          requests:
            storage: 10Gi
