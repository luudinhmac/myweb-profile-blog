apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-frontend
  template:
    metadata:
      labels:
        app: portfolio-frontend
    spec:
      containers:
      - name: frontend
        image: luudinhmac/portfolio-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: TZ
          value: "Asia/Ho_Chi_Minh"
        - name: INTERNAL_API_URL
          value: "http://portfolio-backend:3001"
