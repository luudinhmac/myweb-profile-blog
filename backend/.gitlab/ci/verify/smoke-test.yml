smoke_test_staging:
  stage: post-deploy
  image: alpine:3.21
  tags:
    - agent-1
  needs:
    - deploy_staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  before_script:
    - apk add --no-cache curl jq
  script:
    - echo "Executing backend smoke test for staging..."
    - sh .gitlab/scripts/smoke-test.sh https://api-staging.luumac.io.vn staging dev-$CI_COMMIT_SHORT_SHA
  after_script:
    - |
      if [ -f test_user_id.txt ]; then
        REG_USER_ID=$(cat test_user_id.txt | tr -d '\r\n')
        if [ -n "$REG_USER_ID" ] && [ "$REG_USER_ID" != "null" ]; then
          echo "after_script: Backup cleanup triggered for test user: $REG_USER_ID"
          if [ -n "$ADMIN_USERNAME" ] && [ -n "$ADMIN_PASSWORD" ]; then
            ADMIN_LOGIN_RESP=$(curl -s -X POST \
              -H "Content-Type: application/json" \
              --connect-timeout 5 --max-time 15 \
              -d "{\"username\":\"$ADMIN_USERNAME\",\"password\":\"$ADMIN_PASSWORD\"}" \
              "https://api-staging.luumac.io.vn/api/v1/auth/login" || true)
            
            ADMIN_TOKEN=$(echo "$ADMIN_LOGIN_RESP" | jq -r '.token' 2>/dev/null | tr -d '\r' || true)
            if [ -n "$ADMIN_TOKEN" ] && [ "$ADMIN_TOKEN" != "null" ]; then
              DELETE_RESP=$(curl -s -X DELETE \
                -H "Authorization: Bearer $ADMIN_TOKEN" \
                --connect-timeout 5 --max-time 15 \
                "https://api-staging.luumac.io.vn/api/v1/users/$REG_USER_ID" || true)
              DELETE_SUCCESS=$(echo "$DELETE_RESP" | jq -r '.success' 2>/dev/null | tr -d '\r' || true)
              if [ "$DELETE_SUCCESS" = "true" ]; then
                echo "after_script: Test user $REG_USER_ID deleted successfully."
              else
                echo "after_script: Failed to delete test user. Response: $DELETE_RESP"
              fi
            else
              echo "after_script: Failed to login as Admin (Token: $ADMIN_TOKEN)."
            fi
          else
            echo "after_script: ADMIN_USERNAME or ADMIN_PASSWORD is not set."
          fi
        fi
      fi
    - sh .gitlab/scripts/notify.sh $CI_JOB_STATUS $CI_JOB_STAGE


smoke_test_production:
  stage: post-deploy
  image: alpine:3.21
  tags:
    - agent-1
  needs:
    - deploy_production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
  before_script:
    - apk add --no-cache curl jq
  script:
    - echo "Executing backend smoke test for production..."
    - sh .gitlab/scripts/smoke-test.sh https://api.luumac.io.vn production $CI_COMMIT_TAG
