workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - "src/**/*"
        - "shared/**/*"
        - "prisma/**/*"
        - "scripts/**/*"
        - ".gitlab/**/*"
        - ".gitlab-ci.yml"
        - "Dockerfile"
        - "package.json"
        - "pnpm-lock.yaml"
        - "tsconfig.json"
        - "tsconfig.build.json"
        - "nest-cli.json"
        - "eslint.config.mjs"
        - "check_macld.ts"
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
  auto_cancel:
    on_new_commit: interruptible
