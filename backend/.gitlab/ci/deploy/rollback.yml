rollback-staging:
  stage: deploy
  image: alpine:3.21
  tags:
    - agent-1
  resource_group: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  when: manual
  before_script:
    - apk add --no-cache git yq bash wget
  script:
    - bash .gitlab/scripts/rollback.sh staging

rollback-production:
  stage: deploy
  image: alpine:3.21
  tags:
    - agent-1
  resource_group: production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
  when: manual
  before_script:
    - apk add --no-cache git yq bash wget
  script:
    - bash .gitlab/scripts/rollback.sh production
