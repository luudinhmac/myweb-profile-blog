# ==============================================================================
# ENVIRONMENT: Staging (Frontend)
# PURPOSE: Integration testing and preview
# UPDATE POLICY: Automated CI/CD image tag updates
# ==============================================================================

image:
  tag: "dev-3a2c4735"

ingress:
  enabled: true
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: staging.luumac.io.vn
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: luumac-wildcard-tls
      hosts:
        - staging.luumac.io.vn

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  tz: "Asia/Ho_Chi_Minh"
  nodeEnv: "production"
  internalApiUrl: "http://portfolio-backend-staging:3001/api/v1"
