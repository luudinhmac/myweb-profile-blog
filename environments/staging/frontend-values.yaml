image:
  tag: "latest"

ingress:
  enabled: true
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: staging.luumac.io.vn
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: luumac-wildcard-tls
      hosts:
        - staging.luumac.io.vn
