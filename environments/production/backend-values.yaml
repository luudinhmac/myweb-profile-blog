# ==============================================================================
# ENVIRONMENT: Production (Backend)
# PURPOSE: Live traffic handling
# SECURITY: Strict TLS enforcement with Let's Encrypt certificates
# ==============================================================================

replicaCount: 1
image:
  tag: "v0.0.13@sha256:e963d311a52d54652629cb9db4132a5c2ab968ea8d22ed298a9b44343bcbf1ca"
ingress:
  enabled: true
  issuer: letsencrypt-prod
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod" # Triggers cert-manager to provision production certificates
  hosts:
    - host: api.luumac.io.vn # Production API endpoint
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: portfolio-backend-tls
      hosts:
        - api.luumac.io.vn
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
persistence:
  storageClassName: "longhorn"
sealedSecret:
  enabled: true
  encryptedData:
    DATABASE_URL: 
    JWT_SECRET: 
    MINIO_ACCESS_KEY: 
    MINIO_SECRET_KEY: 
    MINIO_BUCKET: 
    MINIO_CDN_URL: 
    MINIO_ENDPOINT: 
    MINIO_PORT: 
    MINIO_USE_SSL: 
    STORAGE_TYPE: 
redis:
  enabled: true
  encryptedPassword: ""
