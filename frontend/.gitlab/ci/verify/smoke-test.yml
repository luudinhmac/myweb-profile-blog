smoke_test_staging:
  stage: post-deploy
  image: alpine:3.21
  tags:
    - agent-1
  needs:
    - deploy_staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Executing frontend smoke test for staging..."
    - sh .gitlab/scripts/smoke-test.sh https://staging.luumac.io.vn staging

smoke_test_production:
  stage: post-deploy
  image: alpine:3.21
  tags:
    - agent-1
  needs:
    - deploy_production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Executing frontend smoke test for production..."
    - sh .gitlab/scripts/smoke-test.sh https://blog.luumac.io.vn production
