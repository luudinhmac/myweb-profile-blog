workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - "src/**/*"
        - "public/**/*"
        - ".gitlab/**/*"
        - ".gitlab-ci.yml"
        - "Dockerfile"
        - "package.json"
        - "pnpm-lock.yaml"
        - "next.config.js"
        - "tsconfig.json"
        - "postcss.config.mjs"
        - "eslint.config.mjs"
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
  auto_cancel:
    on_new_commit: interruptible
