# Description: Ingress manifest for ArgoCD Server in the production environment.
# Provides secure access via HTTPS with admin allowlist protection.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-argocd-ingress-production
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: infra-admin-allowlist@kubernetescrd,infra-infra-compress@kubernetescrd
spec:
  rules:
  - host: argocd.luumac.io.vn # Or argocd-prod if you want to distinguish
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 80
  tls:
  - hosts:
    - argocd.luumac.io.vn
    secretName: luumac-wildcard-tls
