stages:
  - deploy

variables:
  K8S_NAMESPACE: portfolio
  TZ: Asia/Ho_Chi_Minh

.k8s_auth: &k8s_auth
  before_script:
    - echo "$KUBE_CONFIG_BASE64" | base64 -d > kubeconfig
    - export KUBECONFIG=$PWD/kubeconfig

deploy_apps:
  stage: deploy
  image:
    name: alpine/helm:latest
    entrypoint: [""]
  tags:
    - agent-1
  <<: *k8s_auth
  script:
    - apk add --no-cache curl jq
    - |
      echo "Fetching latest tags from Docker Hub..."
      BACKEND_TAG=$(curl -s "https://hub.docker.com/v2/repositories/luudinhmac/portfolio-backend/tags/?page_size=2" | jq -r '.results | map(select(.name != "latest")) | .[0].name')
      FRONTEND_TAG=$(curl -s "https://hub.docker.com/v2/repositories/luudinhmac/portfolio-frontend/tags/?page_size=2" | jq -r '.results | map(select(.name != "latest")) | .[0].name')
      
      echo "Backend Tag: $BACKEND_TAG"
      echo "Frontend Tag: $FRONTEND_TAG"
      
      # Triển khai Backend
      helm upgrade --install portfolio-backend ./helm/backend \
        --namespace portfolio \
        --set image.tag=$BACKEND_TAG \
        --kube-insecure-skip-tls-verify
      
      # Triển khai Frontend
      helm upgrade --install portfolio-frontend ./helm/frontend \
        --namespace portfolio \
        --set image.tag=$FRONTEND_TAG \
        --kube-insecure-skip-tls-verify
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "web" # Cho phép chạy thủ công từ giao diện
