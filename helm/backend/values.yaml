replicaCount: 1

image:
  repository: luudinhmac/portfolio-backend
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 3001

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  size: 5Gi
  path: /data/k8s/storage/backend-uploads

env:
  tz: "Asia/Ho_Chi_Minh"
  port: "3001"

namespace: portfolio
