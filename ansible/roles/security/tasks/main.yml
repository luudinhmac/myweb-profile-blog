# Description: Main tasks for the 'security' role.
# Configures host security settings like UFW rules and basic hardening.
# Last Updated: 2026-05-12

---
- name: Install UFW
  apt:
    name: ufw
    state: present
    update_cache: yes

- name: Reset UFW rules
  ufw:
    state: reset

- name: Set default UFW policies
  ufw:
    default: deny
    direction: incoming

- name: Allow loopback traffic
  ufw:
    rule: allow
    interface: lo
    direction: in

- name: Allow SSH (Port 22)
  ufw:
    rule: allow
    port: 22
    proto: tcp

- name: Allow HTTP (Port 80)
  ufw:
    rule: allow
    port: 80
    proto: tcp

- name: Allow HTTPS (Port 443)
  ufw:
    rule: allow
    port: 443
    proto: tcp

- name: Allow all traffic from internal subnet
  ufw:
    rule: allow
    src: "{{ internal_subnet }}"

- name: Allow all traffic from Pod network (Service range)
  ufw:
    rule: allow
    src: "{{ service_network_cidr }}"

- name: Allow all traffic from Pod network (Pod range)
  ufw:
    rule: allow
    src: "{{ pod_network_cidr }}"

- name: Allow traffic on Flannel interface
  shell: ufw allow in on flannel.1
  ignore_errors: yes

- name: Allow traffic on CNI interface
  shell: ufw allow in on cni0
  ignore_errors: yes

- name: Enable UFW
  ufw:
    state: enabled

- name: Install Fail2ban
  apt:
    name: fail2ban
    state: present

- name: Ensure Fail2ban is running
  service:
    name: fail2ban
    state: started
    enabled: yes

- name: Harden SSH Configuration
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop:
    - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
    - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
    - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries 3' }
    - { regexp: '^#?X11Forwarding', line: 'X11Forwarding no' }
  notify: Restart SSH

- name: Create Fail2ban local config for SSH
  copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = 22
      filter = sshd
      logpath = /var/log/auth.log
      maxretry = 3
      bantime = 1h
  notify: Restart Fail2ban
