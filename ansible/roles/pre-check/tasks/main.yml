---
- name: Verify that ports 80 and 443 are not occupied by non-K8s processes
  shell: |
    {% raw %}
    # Check port 80
    P80=$(lsof -i :80 -t)
    if [ ! -z "$P80" ]; then
      # If port 80 is used, check if it's the traefik process we manage
      PID_NAME=$(ps -p $P80 -o comm=)
      if [ "$PID_NAME" != "traefik" ] && [ "$PID_NAME" != "containerd" ]; then
        echo "Port 80 is occupied by $PID_NAME (PID: $P80)"
        exit 1
      fi
    fi

    # Check port 443
    P443=$(lsof -i :443 -t)
    if [ ! -z "$P443" ]; then
      PID_NAME=$(ps -p $P443 -o comm=)
      if [ "$PID_NAME" != "traefik" ] && [ "$PID_NAME" != "containerd" ]; then
        echo "Port 443 is occupied by $PID_NAME (PID: $P443)"
        exit 1
      fi
    fi
    {% endraw %}
  register: port_check
  failed_when: port_check.rc != 0
  changed_when: false

- name: Check free disk space (require at least 5GB on /var/lib/containerd)
  shell: df /var/lib/containerd --output=avail -h | tail -1 | tr -d 'G' | tr -d 'M' | awk '{print ($1 > 5)}'
  register: disk_space
  failed_when: disk_space.stdout != "1"
  changed_when: false
  ignore_errors: yes # Don't fail if directory doesn't exist yet, but warn

- name: Verify Sudo access without password
  command: sudo -n true
  changed_when: false
  failed_when: false
  register: sudo_check

- name: Fail if Sudo requires password
  fail:
    msg: "User {{ ansible_user }} requires a sudo password. Please configure passwordless sudo or provide --ask-become-pass."
  when: sudo_check.rc != 0
