---
- name: Create base data directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0775'
    owner: macld
    group: macld
  loop:
    - /data/k8s
    - /data/k8s/uploads
    - /data/k8s/manifests

- name: Sync k8s manifests (manual rsync)
  shell: rsync -avz -e "ssh -i /home/macld/.ssh/id_ed25519_ansible -o StrictHostKeyChecking=no" /home/macld/Portfolio/infra/k8s/ macld@192.168.157.110:/data/k8s/manifests/
  delegate_to: localhost
  become: no

- name: Apply Global Storage (PVs)
  become_user: macld
  command: kubectl apply -f /data/k8s/manifests/base/storage.yaml

- name: Wait for PVs to be Available
  become_user: macld
  shell: |
    for pv in postgres-pv uploads-pv; do
      kubectl wait --for=jsonpath='{.status.phase}'=Available pv/$pv --timeout=60s
    done

- name: Create Portfolio Secrets
  become_user: macld
  shell: |
    # Get existing secret if available to persist JWT_SECRET
    EXISTING_JWT=$(kubectl get secret portfolio-secrets -n portfolio -o jsonpath='{.data.JWT_SECRET}' | base64 -d || echo "")
    if [ -z "$EXISTING_JWT" ]; then
      JWT_SECRET=$(openssl rand -base64 32)
    else
      JWT_SECRET=$EXISTING_JWT
    fi
    
    kubectl create secret generic portfolio-secrets \
    --from-literal=DATABASE_URL="postgresql://staging_user:admin@portfolio-postgres.infra:5432/portfolio_staging" \
    --from-literal=JWT_SECRET="$JWT_SECRET" \
    -n portfolio --dry-run=client -o yaml | kubectl apply -f -

- name: Cleanup legacy resources (Infra namespace)
  become_user: macld
  shell: |
    kubectl delete ingress portfolio-ingress -n infra --ignore-not-found
    kubectl delete svc portfolio-backend portfolio-frontend -n infra --ignore-not-found

- name: Apply Infrastructure Manifests
  become_user: macld
  command: kubectl apply -f /data/k8s/manifests/infra/{{ item }}
  loop:
    - postgres/statefulset.yaml
    - traefik/ingress.yaml

- name: Apply Backend Manifests
  become_user: macld
  command: kubectl apply -f /data/k8s/manifests/backend/

- name: Apply Frontend Manifests
  become_user: macld
  command: kubectl apply -f /data/k8s/manifests/frontend/

- name: Wait for services to be ready
  become_user: macld
  shell: |
    kubectl wait --for=condition=Ready pod -l app=portfolio-postgres -n infra --timeout=120s
    kubectl wait --for=condition=available --timeout=120s deployment/portfolio-backend -n portfolio
    kubectl wait --for=condition=available --timeout=120s deployment/portfolio-frontend -n portfolio

- name: Database Seeding (Initial Setup)
  become_user: macld
  shell: |
    BACKEND_POD=$(kubectl get pods -n portfolio -l app=portfolio-backend -o jsonpath='{.items[0].metadata.name}')
    # Run prisma push and seed
    kubectl exec -n portfolio $BACKEND_POD -- npx prisma db push --accept-data-loss
    kubectl exec -n portfolio $BACKEND_POD -- node scripts/seed.js
  register: seed_output
  ignore_errors: yes

- name: Display Seed Output
  debug:
    var: seed_output.stdout_lines