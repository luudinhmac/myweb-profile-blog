---
- name: Check if k8s is already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: k8s_init

- name: Initialize k8s cluster
  # Initialize the Kubernetes control plane. Cilium manages its own pod network.
  command: kubeadm init
  when: not k8s_init.stat.exists

- name: Create .kube directory for macld
  file:
    path: /home/macld/.kube
    state: directory
    owner: macld
    group: macld
    mode: '0755'

- name: Copy admin.conf to macld's .kube
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/macld/.kube/config
    remote_src: yes
    owner: macld
    group: macld
    mode: '0600'

- name: Install Cilium CLI
  shell: |
    CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
    CLI_ARCH=amd64
    if [ "$(uname -m)" = "aarch64" ]; then CLI_ARCH=arm64; fi
    curl -L --fail --remote-name-all https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}
    sha256sum --check cilium-linux-${CLI_ARCH}.tar.gz.sha256sum
    tar xzvfC cilium-linux-${CLI_ARCH}.tar.gz /usr/local/bin
    rm cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}
  args:
    creates: /usr/local/bin/cilium

- name: Check Cilium status
  become_user: macld
  command: cilium status
  register: cilium_status
  failed_when: false
  changed_when: false

- name: Install Cilium CNI
  become_user: macld
  command: cilium install
  when: cilium_status.rc != 0

- name: Remove taint from control-plane node (allow running pods on master)
  become_user: macld
  command: kubectl taint nodes --all node-role.kubernetes.io/control-plane-
  failed_when: false
  changed_when: false
  ignore_errors: yes
