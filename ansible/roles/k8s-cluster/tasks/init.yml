---
- name: Check if cluster is initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: kube_admin_conf

- name: Initialize Kubernetes cluster
  command: kubeadm init --pod-network-cidr={{ pod_network_cidr }} --service-cidr={{ service_network_cidr }}
  when: not kube_admin_conf.stat.exists
  register: kubeadm_init

- name: Create .kube directory for operator user
  file:
    path: "{{ user_home }}/.kube"
    state: directory
    mode: '0755'
    owner: "{{ ansible_operator_user }}"
    group: "{{ ansible_operator_user }}"

- name: Copy admin.conf to operator user's .kube
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ user_home }}/.kube/config"
    remote_src: yes
    owner: "{{ ansible_operator_user }}"
    group: "{{ ansible_operator_user }}"

- name: Install Flannel CNI
  become_user: "{{ ansible_operator_user }}"
  command: kubectl apply -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml

- name: Remove Taint from Master (Single Node Cluster)
  become_user: "{{ ansible_operator_user }}"
  command: kubectl taint nodes --all node-role.kubernetes.io/control-plane-
  ignore_errors: yes

- name: Wait for node to be ready
  become_user: "{{ ansible_operator_user }}"
  command: kubectl wait --for=condition=Ready node/{{ ansible_hostname }} --timeout=60s
  ignore_errors: yes
