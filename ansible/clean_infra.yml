---
- name: Infrastructure Cleanup (Hard Reset)
  hosts: staging_k8s, production
  become: yes
  vars:
    ansible_become_pass: "{{ SUDO_PASSWORD | default('') }}"
  tasks:
    - name: Uninstall Traefik Helm Release
      become_user: macld
      command: helm uninstall traefik -n infra
      ignore_errors: yes

    - name: Delete Namespaces (This will delete all pods, svc, pvc)
      become_user: macld
      shell: |
        kubectl delete namespace portfolio --timeout=60s
        kubectl delete namespace infra --timeout=60s
      ignore_errors: yes

    - name: Delete Global PVs
      become_user: macld
      shell: |
        kubectl delete pv postgres-pv uploads-pv --ignore-not-found
      ignore_errors: yes

    - name: Force delete stuck namespaces (optional)
      become_user: macld
      shell: |
        kubectl patch ns portfolio -p '{"spec":{"finalizers":[]}}' --type=merge || true
        kubectl patch ns infra -p '{"spec":{"finalizers":[]}}' --type=merge || true
      ignore_errors: yes

    - name: Deep Cluster Reset (kubeadm reset)
      shell: |
        kubeadm reset --force
        rm -rf /etc/cni/net.d
        rm -rf $HOME/.kube/config
        rm -rf /etc/kubernetes
        rm -rf /var/lib/kubelet
        rm -rf /var/lib/etcd
      tags: ["never", "deep-clean"]
      ignore_errors: yes

    - name: Flush IPTables
      shell: |
        iptables -F && iptables -t nat -F && iptables -t mangle -F && iptables -X
      tags: ["never", "deep-clean"]
      ignore_errors: yes

    - name: Cleanup Data Directories on Host
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /data/k8s/postgres
        - /data/k8s/uploads
        - /data/k8s/manifests
      tags: ["dangerous", "deep-clean"]

    - name: Recreate Base Manifests Directory
      file:
        path: /data/k8s/manifests
        state: directory
        owner: macld
        group: macld
        mode: '0775'
      tags: ["deep-clean"]

    - name: Final Cleanup Confirmation
      debug:
        msg: "Infrastructure cleaned. Ready for fresh deployment."
