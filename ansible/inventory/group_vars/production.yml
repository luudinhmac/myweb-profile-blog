# Description: Production group variables for Ansible.
# Environment: Production

env: production
is_production: true

# K8s Node Roles
k8s_role: master
node_labels:
  - env=production
  - role=master

# Infrastructure Services
traefik_enabled: true
cert_manager_enabled: true
argo_cd_enabled: true

# Traefik Configuration
traefik_additional_arguments: "{--accesslog=true,--accesslog.format=json}"
