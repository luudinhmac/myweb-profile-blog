# Description: Ansible playbook to set up a single-node Kubernetes cluster.
# Orchestrates common, docker, k8s-cluster, and infra-services roles.
# Last Updated: 2026-05-12

---
- name: Setup Kubernetes Cluster on Single Node
  hosts: k8s_server
  become: yes
  roles:
    - common
    - network
    - vpn
    - docker
    - k8s-cluster
    - infra-services
