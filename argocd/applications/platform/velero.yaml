apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-velero
  namespace: argocd
spec:
  project: platform-project
  source:
    chart: velero
    repoURL: https://vmware-tanzu.github.io/helm-charts
    targetRevision: 7.1.3
    helm:
      releaseName: velero
      values: |
        configuration:
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: <YOUR_R2_BUCKET_NAME>
              config:
                region: auto
                s3ForcePathStyle: true
                s3Url: https://<YOUR_CLOUDFLARE_ACCOUNT_ID>.r2.cloudflarestorage.com
          # Default to using File System Backup (restic/kopia) for all PVs
          defaultVolumesToFsBackup: true
          extraEnvVars:
            AWS_EC2_METADATA_DISABLED: "true"
        
        # Deploy Node Agent (daemonset) to perform filesystem backup on PVs
        deployNodeAgent: true
        
        # Use existing secret managed by Ansible
        credentials:
          existingSecret: cloud-credentials
          secretKeys:
            cloud: cloud

        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.10.1
            imagePullPolicy: IfNotPresent
            volumeMounts:
              - mountPath: /target
                name: plugins
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
