{{- if eq .Values.secretsProvider "doppler" }}
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: {{ include "backend.fullname" . }}-doppler-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  tokenSecret:
    name: {{ .Values.doppler.tokenSecretName }}
  managedSecret:
    name: {{ .Values.secretName | default "portfolio-secrets" }}
{{- end }}
