apiVersion: v1
kind: ServiceAccount
metadata:
  name: support-user
  namespace: infra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: support-user-view-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view # Standard Kubernetes read-only role
subjects:
- kind: ServiceAccount
  name: support-user
  namespace: infra
---
apiVersion: v1
kind: Secret
metadata:
  name: support-user-token
  namespace: infra
  annotations:
    kubernetes.io/service-account.name: support-user
type: kubernetes.io/service-account-token

