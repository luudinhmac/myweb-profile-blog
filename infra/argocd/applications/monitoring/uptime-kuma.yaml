apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-uptime-kuma
  namespace: argocd
spec:
  project: monitoring-project
  source:
    repoURL: https://gitlab.com/portfolio-macld/portfolio-infratructure.git
    targetRevision: main
    path: monitoring/uptime-kuma
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
