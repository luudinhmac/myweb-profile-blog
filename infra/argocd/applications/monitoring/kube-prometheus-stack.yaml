apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-kube-prometheus-stack
  namespace: argocd
spec:
  project: monitoring-project
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 85.1.3
    helm:
      releaseName: monitoring
      values: |
        fullnameOverride: "monitoring-kube"

        grafana:
          replicas: 0
          serviceMonitor:
            enabled: false
          adminPassword: admin
          nodeSelector: {}
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: node-type
                        operator: In
                        values:
                          - local
          persistence:
            enabled: true
            size: 2Gi
            storageClassName: local-path
          initChownData:
            enabled: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 10
          readinessProbe:
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 10

        prometheus:
          serviceMonitor:
            selfMonitor: true
            metricRelabelings:
              - action: keep
                sourceLabels: [__name__]
                regex: 'prometheus_tsdb_.*|prometheus_engine_.*|prometheus_sd_.*|up'
          prometheusSpec:
            nodeSelector: {}
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: node-type
                          operator: In
                          values:
                            - local
            scrapeInterval: 60s
            evaluationInterval: 60s
            retention: 2d
            storageSpec:
              volumeClaimTemplate:
                metadata:
                  name: prometheus-db
                spec:
                  storageClassName: local-path
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 2Gi
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: 300m
                memory: 512Mi

        alertmanager:
          serviceMonitor:
            selfMonitor: false
          alertmanagerSpec:
            nodeSelector: {}
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: node-type
                          operator: In
                          values:
                            - local
            secrets:
              - alertmanager-telegram-secrets
            containers:
              - name: alertmanager
                env:
                  - name: TZ
                    value: "Asia/Ho_Chi_Minh"
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 64Mi
          config:
            global:
              resolve_timeout: 5m
            route:
              group_by: ['alertname', 'namespace', 'job']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              receiver: 'telegram-infra-alerts'
              routes:
                - matchers:
                    - alertname =~ "Watchdog|InfoInhibitor|KubeControllerManagerInstanceUnreachable|KubeSchedulerInstanceUnreachable|KubeProxyInstanceUnreachable|KubeControllerManagerDown|KubeSchedulerDown|KubeProxyDown|etcdInsufficientMembers|etcdMembersDown|KubeCPUOvercommit|CPUThrottlingHigh"
                  receiver: 'null'
                - matchers:
                    - alertname = TargetDown
                    - job =~ "kube-etcd|kube-controller-manager|kube-scheduler"
                  receiver: 'null'
            receivers:
              - name: 'null'
              - name: 'telegram-infra-alerts'
                telegram_configs:
                  - bot_token_file: '/etc/alertmanager/secrets/alertmanager-telegram-secrets/telegram_bot_token'
                    chat_id: -5015102629
                    parse_mode: 'HTML'
                    send_resolved: true
                    message: |
                      {{ range .Alerts -}}
                      {{ if eq .Status "firing" }}🚨 <b>[CẢNH BÁO HẠ TẦNG] {{ .Labels.alertname }}</b>
                      <b>Độ nghiêm trọng:</b> <code>{{ .Labels.severity }}</code>
                      <b>Namespace:</b> <code>{{ .Labels.namespace }}</code>
                      {{ if .Labels.pod }}<b>Pod liên quan:</b> <code>{{ .Labels.pod }}</code>
                      {{ end }}<b>Chi tiết:</b> {{ .Annotations.summary }}
                      <b>Thời gian xảy ra:</b> {{ .StartsAt.Local.Format "2006-01-02 15:04:05" }} ICT{{ else }}✅ <b>[ĐÃ PHỤC HỒI] {{ .Labels.alertname }}</b>
                      <b>Độ nghiêm trọng:</b> <code>{{ .Labels.severity }}</code>
                      <b>Namespace:</b> <code>{{ .Labels.namespace }}</code>
                      {{ if .Labels.pod }}<b>Pod liên quan:</b> <code>{{ .Labels.pod }}</code>
                      {{ end }}<b>Chi tiết:</b> {{ .Annotations.summary }}
                      <b>Thời gian xảy ra:</b> {{ .StartsAt.Local.Format "2006-01-02 15:04:05" }} ICT
                      <b>Thời gian phục hồi:</b> {{ .EndsAt.Local.Format "2006-01-02 15:04:05" }} ICT
                      <b>Thời gian khắc phục:</b> <code>{{ (.EndsAt.Sub .StartsAt).Truncate 1000000000 }}</code>{{ end }}
                      {{ end }}

        prometheusOperator:
          serviceMonitor:
            selfMonitor: false
          nodeSelector: {}
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: node-type
                        operator: In
                        values:
                          - local
          resources:
            requests:
              cpu: 20m
              memory: 50Mi
            limits:
              cpu: 100m
              memory: 100Mi

        kube-state-metrics:
          nodeSelector: {}
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: node-type
                        operator: In
                        values:
                          - local
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi

        prometheus-node-exporter:
          service:
            port: 9101
            targetPort: 9101
          hostPort: 9101
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 32Mi

        # Disable control plane monitoring which is not needed on single-node VPS
        kubeEtcd:
          enabled: false
          serviceMonitor:
            enabled: false
        kubeControllerManager:
          enabled: false
          serviceMonitor:
            enabled: false
        kubeScheduler:
          enabled: false
          serviceMonitor:
            enabled: false
        kubeProxy:
          enabled: false
          serviceMonitor:
            enabled: false

        kubeApiServer:
          enabled: true
          serviceMonitor:
            metricRelabelings:
              - action: keep
                sourceLabels: [__name__]
                regex: 'apiserver_request_total|apiserver_request_duration_seconds_.*|apiserver_current_inflight_requests|up'
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
