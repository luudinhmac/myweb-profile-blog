# ==============================================================================
# ENVIRONMENT: Staging K3s (Backend)
# PURPOSE: Integration testing and sandbox preview
# UPDATE POLICY: Automated CI/CD image tag updates
# ==============================================================================

replicaCount: 1
image:
  tag: "dev-4b1a5bf7"
ingress:
  enabled: true
  rateLimit:
    enabled: true
    average: 100
    burst: 50
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: portfolio-portfolio-backend-staging-k3s-rate-limit@kubernetescrd
  hosts:
    - host: api-k3s.luumac.io.vn
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: portfolio-backend-staging-k3s-tls
      hosts:
        - api-k3s.luumac.io.vn
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
persistence:
  storageClassName: "longhorn"
env:
  tz: "Asia/Ho_Chi_Minh"
  port: "3001"
sealedSecret:
  enabled: true
  encryptedData:
    DATABASE_URL: ""
    JWT_SECRET: ""
    STORAGE_TYPE: ""
redis:
  enabled: true
  encryptedPassword: ""
startupProbe:
  initialDelaySeconds: 15
  periodSeconds: 5
  failureThreshold: 15
livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 2
  failureThreshold: 3
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
