# Description: Helm values for the PostgreSQL staging database in K3s.
# Overrides default values with staging-specific storage (Longhorn) and configuration settings.
# Last Updated: 2026-07-18

replicaCount: 1

persistence:
  size: 5Gi
  storageClassName: "longhorn"

service:
  type: ClusterIP
  port: 5432

sealedSecret:
  enabled: true
  encryptedData:
    POSTGRES_USER: ""
    POSTGRES_PASSWORD: ""
    POSTGRES_DB: ""

podSecurityContext:
  fsGroup: 70
